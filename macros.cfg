# [gcode_macro PRINT_START]
# gcode:
#     M117 Vamoh a darle...         # Mostrar mensaje en pantalla LCD ("¡Vamos a darle!")
#     G90                           # Usar posicionamiento absoluto para los ejes
#     M83                           # Usar extrusión relativa (importante para la purga)
#     G28                           # Hacer homing de todos los ejes (X, Y, Z)
#     BED_MESH_CALIBRATE ADAPTIVE=1 RUNS=2  # Calibrar el mesh adaptativo: mide solo donde se va a imprimir, 2 veces por punto
#     G1 Z2.0 F3000                 # Subir el nozzle a 2 mm para evitar golpear la cama al moverse
#     M109 S200                     # Esperar a que el hotend alcance 200 °C (comenzar purga después del mesh)
#     M190 S60                      # Esperar a que la cama alcance 60 °C
#     G1 X40 Y5 F1500               # Mover el cabezal a la esquina frontal izquierda (zona de purga)
#     G1 Z0.3 F1200                 # Bajar a 0.3 mm sobre la cama (altura de la primera capa)
#     G92 E0                        # Poner el extrusor a 0 (reset del valor E)
#     G1 E2 F200                    # Extruir 2 mm de filamento lentamente para iniciar el flujo
#     G1 X150 E12 F1000             # Dibujar una línea recta hacia la derecha mientras se extruye
#     G1 X40 E12 F1000              # Regresar a la izquierda con otra línea (doble línea opcional)
#     G92 E0                        # Resetear el extrusor nuevamente para comenzar la impresión limpio



[gcode_macro PRINT_START]
description: Vamoh a darle con params
gcode:
    {% set bed_temp = params.BED_TEMP|default(60, true)|float %}
    {% set hotend_temp = params.HOTEND_TEMP|default(200, true)|float %}

    M117 Vamoh a darle...
    G90
    M83
    G28
    BED_MESH_CALIBRATE ADAPTIVE=1 RUNS=2
    G1 Z2.0 F3000                      ; Subir nozzle para moverse sin riesgo
    M190 S{bed_temp}                  ; Esperar a temperatura de la cama
    M109 S{hotend_temp}              ; Esperar a temperatura del hotend
    G1 X40 Y5 F1500                   ; Mover a esquina para purgar
    G1 Z0.3 F1200                     ; Bajar a altura de primera capa
    G92 E0                            ; Reset extrusor
    G1 E2 F200                        ; Purga 2mm
    G1 X150 E12 F1000                 ; Dibujar línea mientras extruye
    G1 X40 E12 F1000                  ; Regresar (opcional, doble línea)
    G92 E0                            ; Reset extrusor para impresión limpia
                  ; Reset extrusor para impresión limpia



[gcode_macro PRINT_START_PLA]
gcode:
    M117 Vamoh a darle...
    G90
    M83
    G28
    BED_MESH_CALIBRATE ADAPTIVE=1 RUNS=2
    G1 Z2.0 F3000               ; Subir nozzle para moverse sin riesgo
    M190 S55                    ; Esperar a temperatura de la cama
    M109 S220                   ; Esperar a temperatura del hotend
    G1 X40 Y5 F1500             ; Mover a esquina para purgar
    G1 Z0.3 F1200               ; Bajar a altura de primera capa
    G92 E0                      ; Reset extrusor
    G1 E2 F200                  ; Purga 2mm
    G1 X150 E12 F1000           ; Dibujar línea mientras extruye
    G1 X40 E12 F1000            ; Regresar (opcional, doble línea)
    G92 E0                      ; Reset extrusor para impresión limpia        

[gcode_macro PRINT_END]
gcode:
    M400                     ; Espera a que termine el buffer
    G91                      ; Modo relativo
    G1 Z30 F600              ; Subir Z 10 mm para evitar rayar pieza
    G90                      ; Volver a modo absoluto
    M104 S0                  ; Apagar hotend
    M140 S0                  ; Apagar cama
    M84                      ; Desactivar motores (opcional)
    M117 Print Finished

