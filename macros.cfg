[gcode_macro HOME_ALL]
description: "Homing XY, move to center, then probe Z"
gcode:
    G90
    G28 X Y
    G1 X175 Y175 F6000
    G1 Z10 F300
    PROBE

[gcode_macro SAFE_HOME]
gcode:
    G28 X Y       ; Hacer homing de X y Y primero
    G1 Z10 F1000  ; Mover Z a una altura segura para evitar colisiones
    G28 Z ;
    PROBE           ; Hacer homing del eje Z con el probe


[gcode_macro FILAMENT_UNLOAD]
description: Descargar filamento (con temperatura ajustable)
gcode:
  {% set temperature = params.TEMPERATURE if params.TEMPERATURE is not none else 210 %}
  M104 S{temperature} ; Calienta el hotend a la temperatura proporcionada (por defecto 210°C)
  M109 S{temperature} ; Espera a que el hotend esté listo
  G92 E0 ; Resetea el extrusor
  G1 E-50 F200 ; Retira 100mm de filamento
  G92 E0 ; Resetea el extrusor de nuevo
  G1 Z10 F1000 ; Mueve el extrusor hacia arriba para facilitar la retirada del filamento

[gcode_macro FILAMENT_LOAD]
description: Cargar filamento (con temperatura ajustable)
gcode:
  {% set temperature = params.TEMPERATURE if params.TEMPERATURE is not none else 210 %}
  M104 S{temperature} ; Calienta el hotend a la temperatura proporcionada (por defecto 210°C)
  M109 S{temperature} ; Espera a que el hotend esté listo
  G92 E0 ; Resetea el extrusor
  G1 E150 F300 ; Empuja 200mm de filamento (aumentamos la cantidad)
  G92 E0 ; Resetea el extrusor de nuevo
  G1 E20 F300 ; Empuja un poco más de filamento para asegurar la carga

  
